<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>
<style>
body{margin:0;background:#f4f6f8;font-family:system-ui;color:#17202a}
header{background:#111827;color:white;padding:20px}
main{max-width:800px;margin:25px auto;padding:0 15px}
.card{background:white;padding:22px;border-radius:14px;box-shadow:0 2px 10px #0001}
input,textarea,select{width:100%;padding:11px;margin-top:5px;margin-bottom:15px;border:1px solid #d1d5db;border-radius:8px;font:inherit}
input[type=checkbox]{width:auto}
label{font-weight:600}
button,a{display:inline-block;padding:11px 15px;border-radius:9px;border:0;text-decoration:none;font-weight:700}
button{background:#111827;color:white}
a{background:#e5e7eb;color:#111827}
.errorlist{color:#b91c1c}
</style>
</head>

<body>

<header>
<h1>{{ title }}</h1>
</header>

<main>

<div class="card">

<form method="post">
{% csrf_token %}

{{ form.as_p }}

<button type="submit">Save Role</button>
<a href="/control-center/manage/roles/">Cancel</a>

</form>

</div>

</main>
</body>
</html>
