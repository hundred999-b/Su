services:
  - type: web
    name: shopu-web
    runtime: python
    plan: free
    region: frankfurt
    autoDeployTrigger: commit
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /health/
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        sync: false
      - key: TELEGRAM_MAIN_BOT_TOKEN
        sync: false
      - key: TELEGRAM_MAIN_BOT_USERNAME
        sync: false
      - key: TELEGRAM_NOTIFICATION_BOT_TOKEN
        sync: false
      - key: MINIAPP_URL
        sync: false
      - key: SHOPU_CRON_SECRET
        sync: false
      - key: SHOPU_GITHUB_ACTIONS_TOKEN
        sync: false
      - key: SHOPU_GITHUB_REPOSITORY
        value: "hundred999-b/Su"
      - key: SHOPU_GITHUB_EVENT_TYPE
        value: "shopu-job"
      - key: SHOPU_AUTO_RELEASE_HOURS
        value: "6"
      - key: TELEGRAM_INIT_DATA_MAX_AGE_SECONDS
        value: "3600"
      - key: TELEGRAM_INIT_DATA_MAX_FUTURE_SECONDS
        value: "300"
      - key: EXTRA_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY_ID
        sync: false
      - key: SUPABASE_S3_SECRET_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_ENDPOINT_URL
        sync: false
      - key: SUPABASE_S3_REGION
        value: "us-east-1"
      - key: SUPABASE_STORAGE_BUCKET
        value: "shopu-media"

  - type: worker
    name: shopu-telegram
    runtime: python
    plan: starter
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python -m telegram_integration.telegram_bot
    envVars:
      - key: DJANGO_SECRET_KEY
        fromService:
          type: web
          name: shopu-web
          envVarKey: DJANGO_SECRET_KEY
      - key: DJANGO_DEBUG
        value: "false"
      - key: DATABASE_URL
        fromService:
          type: web
          name: shopu-web
          envVarKey: DATABASE_URL
      - key: TELEGRAM_MAIN_BOT_TOKEN
        fromService:
          type: web
          name: shopu-web
          envVarKey: TELEGRAM_MAIN_BOT_TOKEN
      - key: TELEGRAM_MAIN_BOT_USERNAME
        fromService:
          type: web
          name: shopu-web
          envVarKey: TELEGRAM_MAIN_BOT_USERNAME
      - key: MINIAPP_URL
        fromService:
          type: web
          name: shopu-web
          envVarKey: MINIAPP_URL
      - key: TELEGRAM_NOTIFICATION_BOT_TOKEN
        fromService:
          type: web
          name: shopu-web
          envVarKey: TELEGRAM_NOTIFICATION_BOT_TOKEN
      - key: SHOPU_WEB_HOST
        fromService:
          type: web
          name: shopu-web
          property: host
