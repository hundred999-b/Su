<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>{{ title }} — ShopU</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    background:#f1f5f9;
    color:#17202a;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

header{
    background:#111827;
    color:white;
    padding:18px;
}

main{
    max-width:850px;
    margin:auto;
    padding:22px 15px 50px;
}

.top{
    margin-bottom:18px;
}

.card{
    background:white;
    border-radius:15px;
    padding:22px;
    box-shadow:0 2px 10px #0000000b;
}

label{
    display:block;
    font-weight:700;
    margin-top:15px;
}

input,
select,
textarea{
    width:100%;
    padding:11px;
    margin-top:6px;
    border:1px solid #d1d5db;
    border-radius:9px;
    font:inherit;
}

input[type=checkbox]{
    width:auto;
}

.helptext{
    display:block;
    color:#64748b;
    font-size:12px;
    margin-top:4px;
}

.errorlist{
    color:#b91c1c;
}

.actions{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-top:22px;
}

button,a{
    border:0;
    border-radius:9px;
    padding:11px 15px;
    text-decoration:none;
    font-weight:700;
    font:inherit;
}

button{
    background:#111827;
    color:white;
    cursor:pointer;
}

a{
    background:#e2e8f0;
    color:#17202a;
}
</style>
</head>

<body>

<header>
<h1>{{ config.icon }} {{ title }}</h1>
</header>

<main>

<div class="top">

<a href="{% if object %}{% url 'controlcenter:section_detail' section object.pk %}{% else %}{% url 'controlcenter:section_list' section %}{% endif %}">
 Back
</a>

</div>

<div class="card">

<form method="post" enctype="multipart/form-data">

{% csrf_token %}

{{ form.non_field_errors }}

{% for field in form %}

<label for="{{ field.id_for_label }}">
{{ field.label }}
</label>

{{ field }}

{% if field.help_text %}
<span class="helptext">
{{ field.help_text }}
</span>
{% endif %}

{{ field.errors }}

{% endfor %}

<div class="actions">

<button type="submit">
Save
</button>

<a href="{% if object %}{% url 'controlcenter:section_detail' section object.pk %}{% else %}{% url 'controlcenter:section_list' section %}{% endif %}">
Cancel
</a>

</div>

</form>

</div>

</main>

</body>
</html>
