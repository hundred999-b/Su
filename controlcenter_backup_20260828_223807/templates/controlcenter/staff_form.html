<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ title }}</title>

<style>
body{
    margin:0;
    background:#f4f6f8;
    font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    color:#17202a;
}

header{
    background:#111827;
    color:white;
    padding:22px 18px;
}

main{
    max-width:800px;
    margin:25px auto;
    padding:0 15px;
}

.card{
    background:white;
    padding:22px;
    border-radius:14px;
    box-shadow:0 2px 10px #0001;
}

label{
    display:block;
    font-weight:700;
    margin-top:15px;
}

input,select,textarea{
    width:100%;
    padding:11px;
    margin-top:6px;
    border:1px solid #d1d5db;
    border-radius:8px;
    font:inherit;
    box-sizing:border-box;
}

input[type=checkbox]{
    width:auto;
}

.helptext{
    display:block;
    color:#64748b;
    font-size:12px;
    margin-top:4px;
}

ul{
    color:#b91c1c;
}

.roles{
    background:#f8fafc;
    padding:14px;
    border-radius:10px;
    margin-top:8px;
}

.roles label{
    margin:8px 0;
    font-weight:500;
}

.actions{
    display:flex;
    gap:10px;
    margin-top:22px;
}

button,a{
    padding:11px 15px;
    border-radius:9px;
    border:0;
    text-decoration:none;
    font-weight:700;
}

button{
    background:#111827;
    color:white;
}

a{
    background:#e5e7eb;
    color:#111827;
}
</style>
</head>

<body>

<header>
<h1>{{ title }}</h1>
</header>

<main>
<div class="card">

<form method="post">
{% csrf_token %}

{{ form.non_field_errors }}

{% for field in form %}
    {% if field.name == "roles" %}
        <label>{{ field.label }}</label>
        <div class="roles">
            {{ field }}
        </div>
    {% else %}
        <label for="{{ field.id_for_label }}">
            {{ field.label }}
        </label>

        {{ field }}

        {% if field.help_text %}
            <span class="helptext">{{ field.help_text }}</span>
        {% endif %}
    {% endif %}

    {{ field.errors }}
{% endfor %}

<div class="actions">
    <button type="submit">{{ submit_text }}</button>
    <a href="/control-center/manage/staff/">Cancel</a>
</div>

</form>

</div>
</main>

</body>
</html>
